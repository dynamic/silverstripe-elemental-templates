# Autogenerated release-notes categories, keyed to type/* labels.
# Install as .github/release.yml in the adopted repo (always per-repo — the org
# .github fallback does not cover it). See docs/changelog-convention.md in
# dynamic/release-framework.
changelog:
  exclude:
    labels:
      - skip-changelog
    authors:
      - dependabot[bot]
  categories:
    - title: Added
      labels:
        - type/enhancement
    - title: Fixed
      labels:
        - type/bug
        - hotfix
    - title: Content
      labels:
        - type/content
    - title: Maintenance
      labels:
        - type/task
        - type/chore
    - title: Other
      labels:
        - "*"
